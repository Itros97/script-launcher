name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04 # an older glibc, so the program also runs on older distributions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Build and pack
        run: |
          folder=script-launcher-linux-x86_64
          mkdir "$folder"
          go build -trimpath -ldflags "-s -w" -o "$folder/script-launcher" ./cmd/script-launcher
          cp packaging/linux/install.sh packaging/linux/script-launcher.desktop "$folder/"
          tar czf "$folder.tar.gz" "$folder"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: script-launcher-linux-x86_64.tar.gz
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build a universal app (Apple silicon and Intel)
        run: |
          export CGO_ENABLED=1
          GOARCH=arm64 CC="clang -arch arm64" go build -trimpath -ldflags "-s -w" -o arm64 ./cmd/script-launcher
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w" -o amd64 ./cmd/script-launcher
          app="Script Launcher.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create arm64 amd64 -output "$app/Contents/MacOS/script-launcher"
          sed "s/@VERSION@/${GITHUB_REF_NAME#v}/" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          ditto -c -k --keepParent "$app" ScriptLauncher-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ScriptLauncher-macOS.zip
  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes ScriptLauncher-macOS.zip script-launcher-linux-x86_64.tar.gz
